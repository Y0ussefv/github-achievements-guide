<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Achievements Guide</title>
  <desc id="desc">Banner for the community guide to GitHub Profile Achievements</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g opacity="0.12" fill="#58a6ff">
    <circle cx="1080" cy="60" r="90"/>
    <circle cx="980" cy="250" r="60"/>
    <circle cx="120" cy="260" r="70"/>
  </g>
  <g transform="translate(110 150)">
