  <text x="232" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">Every profile badge, its real requirements, and how to earn it honestly</text>
  <text x="232" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#58a6ff">Community-maintained · Open source · MIT licensed</text>
